{% set version="2.103.3" %}

package:
  name: gh
  version: {{ version }}

source:
  - url: https://github.com/cli/cli/archive/v{{ version }}.tar.gz
    sha256: bb148138a3a2fe023e57c78042fe3b42fc09171c0e8fff4cf983b227b7a2eade

build:
  number: 0
  script:
      - cd cmd/gh
      - go-licenses save . --save_path ../../../library_licenses --ignore github.com/cyberphone/json-canonicalization --ignore github.com/in-toto/attestation --ignore github.com/in-toto/in-toto-golang --ignore github.com/alecthomas/chroma
      - go build -v {{ "-buildmode=exe" if ppc64le else "" }} -o $PREFIX/bin/gh -ldflags="-s -w -X github.com/cli/cli/v2/internal/build.Version={{ version }}" # [unix]
      - go build -v -o %LIBRARY_BIN%\gh.exe -ldflags="-s -X github.com/cli/cli/v2/internal/build.Version={{ version }}" # [not unix]
      - cd ../..

      # generate manpages with a build-platform binary; a target PIE build of gen-docs crashes on linux-ppc64le
      - GOOS= GOARCH= go run ./cmd/gen-docs --man-page --doc-path ./share/man/man1/                               # [unix]
      - mkdir -p $PREFIX/share/man/man1                        # [unix]
      - install -m644 ./share/man/man1/* $PREFIX/share/man/man1 # [unix]
      - mkdir -p $PREFIX/share/zsh/site-functions $PREFIX/share/bash-completion/completions $PREFIX/share/fish/vendor_completions.d # [unix]
      - $PREFIX/bin/gh completion --shell zsh > $PREFIX/share/zsh/site-functions/_gh # [unix]
      - $PREFIX/bin/gh completion --shell bash > $PREFIX/share/bash-completion/completions/gh # [unix]
      - $PREFIX/bin/gh completion --shell fish > $PREFIX/share/fish/vendor_completions.d/gh.fish # [unix]

requirements:
  build:
    - {{ compiler('go-nocgo') }}
    - go-licenses

about:
  homepage: https://github.com/cli/cli
  license: Apache-2.0
  license_file:
    - LICENSE
  summary: Github CLI.
  documentation: https://cli.github.com/
  repository: https://github.com/cli/cli

extra:
  recipe-maintainers:
    - mxr-conda
    - rluria14
    - oblute
    - matthiasdiener
    - pavelzw
